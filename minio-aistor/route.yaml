apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aistor-s3
  namespace: aistor
spec:
  to:
    kind: Service
    name: aistor
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Route para Console
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aistor-console
  namespace: aistor
spec:
  to:
    kind: Service
    name: aistor
  port:
    targetPort: console
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect